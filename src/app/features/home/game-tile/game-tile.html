@if (game().playable) {
  <a class="tile tile--playable" [routerLink]="['games', game().slug]">
    <ng-container *ngTemplateOutlet="art" />
    <span class="tile__name">{{ name() }}</span>
    @if (subtitle(); as subtitle) {
      <span class="tile__subtitle">{{ subtitle }}</span>
    }
    <span class="tile__status tile__status--play">{{ i18n.t('tile.play') }}</span>
  </a>
} @else {
  <div class="tile tile--soon" aria-disabled="true">
    <ng-container *ngTemplateOutlet="art" />
    <span class="tile__name">{{ name() }}</span>
    @if (subtitle(); as subtitle) {
      <span class="tile__subtitle">{{ subtitle }}</span>
    }
    <span class="tile__status">{{ i18n.t('tile.soon') }}</span>
  </div>
}

<ng-template #art>
  @if (game().image; as image) {
    <span class="tile__art tile__art--image" aria-hidden="true">
      <img [ngSrc]="image" width="150" height="150" alt="" />
    </span>
  } @else {
    <span class="tile__art" aria-hidden="true">{{ initials() }}</span>
  }
</ng-template>
