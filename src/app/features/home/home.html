<main class="page">
  <header class="page__header">
    <h1>{{ i18n.t('app.title') }}</h1>
    <p>{{ i18n.t('home.tagline') }}</p>
  </header>

  <ul class="grid">
    @for (game of games; track game.slug) {
      <li class="grid__item">
        <dg-game-tile [game]="game" />
      </li>
    }
  </ul>
</main>
